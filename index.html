<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomyco Studio — Próximamente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #00F0FF;
      --space: #010828;
      --cream: #EFF4FF;
    }

    body {
      background: var(--space);
      color: var(--cream);
      font-family: 'Anton', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ── INTRO SCREEN ── */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #intro-screen.fade-out { opacity: 0; pointer-events: none; }
    #intro-logo { width: min(300px, 65vw); display: block; }

    /* ── MAIN CONTENT ── */
    #landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      z-index: 0;
      opacity: 0.78;
    }

    #bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at center bottom, transparent 25%, rgba(1,8,40,0.5) 100%),
        linear-gradient(to top, rgba(1,8,40,0.9) 0%, rgba(1,8,40,0.05) 50%, rgba(1,8,40,0.55) 100%);
    }

    /* ── LOGO — top left ── */
    #logo-wrap {
      position: absolute;
      top: 32px;
      left: 40px;
      z-index: 20;
    }
    #logo-canvas {
      width: 160px;
      display: block;
    }

    /* ── CENTER CONTENT ── */
    #center-content {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 32px;
    }

    #headline {
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.2rem, 6vw, 5rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.05;
      color: var(--cream);
      margin-bottom: 18px;
      text-shadow: 0 2px 40px rgba(0,240,255,0.15);
    }

    #subtitle {
      font-family: 'Anton', sans-serif;
      font-size: clamp(0.7rem, 1.3vw, 0.95rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(239,244,255,0.5);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: 44px;
    }

    /* ── REEL BUTTON — estilo "Ver Reel" ── */
    #reel-btn {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    #reel-btn .play-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.25s, background 0.25s, transform 0.25s;
      position: relative;
    }
    #reel-btn .play-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    #reel-btn:hover .play-circle {
      border-color: var(--accent);
      background: rgba(0,240,255,0.08);
      transform: scale(1.06);
    }
    #reel-btn .play-circle svg { margin-left: 4px; }

    #reel-btn .btn-label {
      font-family: 'Condiment', cursive;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      color: var(--cream);
      letter-spacing: 0.02em;
      transition: color 0.25s;
      white-space: nowrap;
    }
    #reel-btn:hover .btn-label { color: var(--accent); }

    /* ── BOTTOM LEFT — contacto ── */
    #bottom-left {
      position: absolute;
      bottom: 40px;
      left: 44px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #tagline {
      font-family: 'Condiment', cursive;
      font-size: clamp(2rem, 3.5vw, 3rem);
      color: var(--accent);
      line-height: 1;
      margin-bottom: 10px;
    }

    .contact-line {
      font-family: 'Anton', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(239,244,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-line:hover { color: var(--accent); }

    /* ── INSTAGRAM — bottom right ── */
    #social-ig {
      position: absolute;
      bottom: 40px;
      right: 44px;
      z-index: 20;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04);
      border: 1.4px solid rgba(255,255,255,0.12);
      transition: border-color 0.2s, background 0.2s;
      text-decoration: none;
      backdrop-filter: blur(4px);
    }
    #social-ig:hover {
      border-color: var(--accent);
      background: rgba(0,240,255,0.08);
    }

    /* ── ENTRY ANIMATIONS ── */
    .fade-up {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .fade-up.visible { opacity: 1; transform: translateY(0); }

    /* ── REEL MODAL ── */
    #reel-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0,0,0,0.88);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }
    #reel-modal.open { display: flex; }
    #reel-inner {
      position: relative;
      width: min(900px, 92vw);
      aspect-ratio: 16/9;
    }
    #reel-iframe { width: 100%; height: 100%; border: none; border-radius: 16px; }
    #reel-close {
      position: absolute;
      top: -44px; right: 0;
      background: none; border: none;
      color: var(--cream);
      font-size: 1.8rem;
      cursor: pointer;
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    #reel-close:hover { color: var(--accent); }
  </style>
</head>
<body>

<!-- INTRO SCREEN -->
<div id="intro-screen">
  <canvas id="intro-logo"></canvas>
</div>

<!-- REEL MODAL -->
<div id="reel-modal" role="dialog" aria-modal="true">
  <div id="reel-inner">
    <button id="reel-close" onclick="closeReel()">✕ Cerrar</button>
    <iframe id="reel-iframe" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<!-- LANDING -->
<div id="landing">
  <img id="bg-image" src="portada/despegue.png" alt="">
  <div id="bg-overlay"></div>

  <!-- Logo top-left -->
  <div id="logo-wrap" class="fade-up">
    <canvas id="logo-canvas" width="160"></canvas>
  </div>

  <!-- Center -->
  <div id="center-content">
    <h1 id="headline" class="fade-up">
      Nos estamos preparando<br>para despegar
    </h1>
    <p id="subtitle" class="fade-up">
      Estudio argentino de contenidos digitales que levitan.<br>
      Desarrollos que se elevan hasta las estrellas.
    </p>
    <button id="reel-btn" class="fade-up" onclick="openReel()">
      <span class="play-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#EFF4FF"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </span>
      <span class="btn-label">Conocé a Cosmo, Luna &amp; Orbit</span>
    </button>
  </div>

  <!-- Bottom left — tagline + contacto -->
  <div id="bottom-left">
    <div id="tagline" class="fade-up">Hacé despegar tu marca</div>
    <a class="contact-line fade-up" href="mailto:produccion@tomycostudio.com">produccion@tomycostudio.com</a>
    <a class="contact-line fade-up" href="tel:+5491124092081">(+54) 9 11 2409-2081</a>
  </div>

  <!-- Instagram bottom-right -->
  <a id="social-ig" class="fade-up" href="https://www.instagram.com/tomyco_studio/" target="_blank" rel="noopener" aria-label="Instagram">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EFF4FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.5" cy="6.5" r="0.8" fill="#EFF4FF" stroke="none"/>
    </svg>
  </a>
</div>

<script>
  /* ── REEL ── */
  var REEL_URL = 'https://www.youtube.com/embed/7AukSIl6S1k?autoplay=1&rel=0&modestbranding=1';
  function openReel() {
    document.getElementById('reel-iframe').src = REEL_URL;
    document.getElementById('reel-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeReel() {
    document.getElementById('reel-modal').classList.remove('open');
    document.getElementById('reel-iframe').src = '';
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeReel(); });
  document.getElementById('reel-modal').addEventListener('click', function(e) {
    if (e.target === this) closeReel();
  });

  /* ── LOGO ANIMATION ── */
  (function() {
    var TOTAL = 52, FPS = 24, frames = [], loaded = 0;
    for (var i = 0; i < TOTAL; i++) {
      var img = new Image();
      img.src = 'Logo/Logo tomyco_' + String(i).padStart(5, '0') + '.png';
      img.onload = (function() { loaded++; if (loaded === TOTAL) startIntro(); });
      img.onerror = (function() { loaded++; if (loaded === TOTAL) startIntro(); });
      frames.push(img);
    }

    function startIntro() {
      var screen = document.getElementById('intro-screen');
      var canvas = document.getElementById('intro-logo');
      var ctx = canvas.getContext('2d');
      var ref = frames.find(function(f) { return f.naturalWidth > 0; });
      if (!ref) { fadeOut(screen); return; }
      var ratio = ref.naturalHeight / ref.naturalWidth;
      canvas.width = Math.min(300, window.innerWidth * 0.65);
      canvas.height = Math.round(canvas.width * ratio);
      var frame = 0;
      var id = setInterval(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(frames[frame], 0, 0, canvas.width, canvas.height);
        if (frame < TOTAL - 1) { frame++; }
        else { clearInterval(id); setTimeout(function() { fadeOut(screen); }, 600); }
      }, 1000 / FPS);
    }

    function fadeOut(screen) {
      screen.classList.add('fade-out');
      setTimeout(function() {
        screen.style.display = 'none';
        revealLanding();
      }, 900);
    }

    function revealLanding() {
      startHeaderLogo();
      var els = document.querySelectorAll('.fade-up');
      els.forEach(function(el, i) {
        setTimeout(function() { el.classList.add('visible'); }, i * 130);
      });
    }

    function startHeaderLogo() {
      var canvas = document.getElementById('logo-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var ref = frames.find(function(f) { return f.naturalWidth > 0; });
      if (!ref) return;
      var ratio = ref.naturalHeight / ref.naturalWidth;
      canvas.height = Math.round(canvas.width * ratio);
      var frame = 0;
      var id = setInterval(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(frames[frame], 0, 0, canvas.width, canvas.height);
        if (frame < TOTAL - 1) { frame++; }
        else { clearInterval(id); }
      }, 1000 / FPS);
    }
  })();
</script>
</body>
</html>
