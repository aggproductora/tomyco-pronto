<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tomyco Studio — Próximamente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #00F0FF;
      --space: #010828;
      --cream: #EFF4FF;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--space);
      color: var(--cream);
      overflow: hidden;
    }

    /* ════════════════════════════
       INTRO SCREEN
    ════════════════════════════ */
    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #intro-screen.fade-out { opacity: 0; pointer-events: none; }
    #intro-logo { width: min(280px, 60vw); display: block; }

    /* ════════════════════════════
       BACKGROUND
    ════════════════════════════ */
    #landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #bg-image {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 70%;
      z-index: 0;
      opacity: 0.78;
    }
    @media (max-width: 600px) {
      #bg-image { object-position: center center; }
    }

    #bg-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to top,  rgba(1,8,40,0.97) 0%,  rgba(1,8,40,0.45) 40%, rgba(1,8,40,0.2) 65%, rgba(1,8,40,0.6) 100%),
        radial-gradient(ellipse 120% 80% at 50% 100%, rgba(1,8,40,0.6) 0%, transparent 70%);
    }

    /* ════════════════════════════
       LOGO — top left
    ════════════════════════════ */
    #logo-wrap {
      position: absolute;
      top: clamp(20px, 3vw, 36px);
      left: clamp(20px, 3vw, 44px);
      z-index: 20;
    }
    #logo-canvas {
      width: clamp(110px, 13vw, 170px);
      display: block;
    }

    /* ════════════════════════════
       CENTER CONTENT
    ════════════════════════════ */
    #center-content {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 24px 160px;
    }

    #headline {
      font-family: 'Anton', sans-serif;
      font-size: clamp(1.9rem, 5.5vw, 4.8rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.06;
      color: var(--cream);
      margin-bottom: 16px;
    }

    #subtitle {
      font-family: 'Anton', sans-serif;
      font-size: clamp(0.62rem, 1.1vw, 0.88rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(239,244,255,0.45);
      line-height: 1.75;
      max-width: 420px;
      margin-bottom: clamp(28px, 5vw, 52px);
    }

    /* ── Reel button ── */
    #reel-btn {
      display: inline-flex;
      align-items: center;
      gap: clamp(12px, 2vw, 22px);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .play-circle {
      flex-shrink: 0;
      width: clamp(56px, 7vw, 76px);
      height: clamp(56px, 7vw, 76px);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.25s, transform 0.25s;
    }
    .play-circle::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 1.4px;
      background: linear-gradient(160deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }
    .play-circle svg { margin-left: 3px; }

    #reel-btn:hover .play-circle {
      background: rgba(0,240,255,0.1);
      transform: scale(1.07);
    }

    .btn-label {
      font-family: 'Condiment', cursive;
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      color: var(--cream);
      letter-spacing: 0.02em;
      transition: color 0.25s;
      text-align: left;
      line-height: 1.1;
    }
    #reel-btn:hover .btn-label { color: var(--accent); }

    /* ════════════════════════════
       BOTTOM BAR
       Desktop: tagline left + instagram right
       Mobile:  stacked, centered
    ════════════════════════════ */
    #bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: clamp(16px, 3vw, 32px) clamp(20px, 4vw, 48px);
      gap: 16px;
    }

    #bottom-left { display: flex; flex-direction: column; gap: 5px; }

    #tagline {
      font-family: 'Condiment', cursive;
      font-size: clamp(1.6rem, 3.2vw, 2.8rem);
      color: var(--accent);
      line-height: 1;
      margin-bottom: 6px;
    }

    .contact-line {
      font-family: 'Anton', sans-serif;
      font-size: clamp(0.6rem, 0.9vw, 0.75rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(239,244,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
      display: block;
    }
    .contact-line:hover { color: var(--accent); }

    /* Instagram */
    #social-ig {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04);
      border: 1.4px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(4px);
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
      align-self: flex-end;
      margin-bottom: 4px;
    }
    #social-ig:hover {
      border-color: var(--accent);
      background: rgba(0,240,255,0.08);
    }

    /* ════════════════════════════
       MOBILE OVERRIDES  (≤ 600px)
    ════════════════════════════ */

    /* Botón mobile: oculto por defecto, visible sólo en mobile */
    #reel-btn-mobile { display: none; }

    @media (max-width: 600px) {
      /* Safe area: logo no queda bajo el notch */
      #logo-wrap {
        top: calc(clamp(20px, 3vw, 36px) + env(safe-area-inset-top, 0px));
        left: calc(clamp(20px, 3vw, 44px) + env(safe-area-inset-left, 0px));
      }

      #center-content {
        padding-top: calc(90px + env(safe-area-inset-top, 0px));
        padding-bottom: 180px;
        padding-left: calc(20px + env(safe-area-inset-left, 0px));
        padding-right: calc(20px + env(safe-area-inset-right, 0px));
        justify-content: center;
      }

      #headline { font-size: clamp(1.7rem, 8vw, 2.4rem); }

      #subtitle {
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        max-width: 90%;
      }

      /* Ocultar botón del área central en mobile */
      #reel-btn { display: none; }

      /* Mostrar botón mobile debajo del tagline */
      #reel-btn-mobile {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        margin-top: 14px;
      }
      #reel-btn-mobile .play-circle { width: 48px; height: 48px; }
      #reel-btn-mobile .btn-label   { font-size: 1.25rem; }

      #bottom-bar {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding-top: 16px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        padding-left: calc(20px + env(safe-area-inset-left, 0px));
        padding-right: calc(20px + env(safe-area-inset-right, 0px));
        gap: 8px;
      }

      #bottom-left { align-items: center; gap: 4px; }

      #tagline { font-size: 1.7rem; }

      .contact-line { font-size: 0.62rem; letter-spacing: 0.1em; }

      #social-ig { align-self: center; margin-bottom: 0; }
    }

    /* ════════════════════════════
       ENTRY ANIMATIONS
       Each element: separate delay assigned via JS
    ════════════════════════════ */
    .fade-up {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ════════════════════════════
       REEL MODAL
    ════════════════════════════ */
    #reel-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    #reel-modal.open { display: flex; }
    #reel-inner {
      position: relative;
      width: min(900px, 94vw);
      aspect-ratio: 16/9;
    }
    #reel-iframe { width: 100%; height: 100%; border: none; border-radius: 14px; }
    #reel-close {
      position: absolute;
      top: -42px; right: 0;
      background: none; border: none;
      color: var(--cream);
      font-size: 1.6rem;
      cursor: pointer;
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    #reel-close:hover { color: var(--accent); }
  </style>
</head>
<body>

<!-- INTRO SCREEN -->
<div id="intro-screen">
  <canvas id="intro-logo"></canvas>
</div>

<!-- REEL MODAL -->
<div id="reel-modal" role="dialog" aria-modal="true">
  <div id="reel-inner">
    <button id="reel-close" onclick="closeReel()">✕ Cerrar</button>
    <iframe id="reel-iframe" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>
</div>

<!-- LANDING -->
<div id="landing">
  <picture>
    <source media="(max-width: 600px)" srcset="portada/fondo-vertical.png">
    <img id="bg-image" src="portada/despegue.png" alt="">
  </picture>
  <div id="bg-overlay"></div>

  <!-- Logo top-left -->
  <div id="logo-wrap" class="fade-up" data-delay="0">
    <canvas id="logo-canvas"></canvas>
  </div>

  <!-- Center -->
  <div id="center-content">
    <h1 id="headline" class="fade-up" data-delay="1">
      Nos estamos preparando<br>para despegar
    </h1>
    <p id="subtitle" class="fade-up" data-delay="2">
      Estudio argentino de contenidos digitales que levitan.<br>
      Desarrollos que se elevan hasta las estrellas.
    </p>
    <button id="reel-btn" class="fade-up" data-delay="3" onclick="openReel()">
      <span class="play-circle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#EFF4FF">
          <polygon points="6 3 20 12 6 21 6 3"/>
        </svg>
      </span>
      <span class="btn-label">Conocé a Cosmo, Luna &amp; Orbit</span>
    </button>
  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <div id="bottom-left">
      <div id="tagline" class="fade-up" data-delay="4">Hacé despegar tu marca</div>
      <button id="reel-btn-mobile" class="fade-up" data-delay="4" onclick="openReel()">
        <span class="play-circle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#EFF4FF">
            <polygon points="6 3 20 12 6 21 6 3"/>
          </svg>
        </span>
        <span class="btn-label">Conocé a Cosmo, Luna &amp; Orbit</span>
      </button>
      <a class="contact-line fade-up" data-delay="5" href="mailto:produccion@tomycostudio.com">produccion@tomycostudio.com</a>
      <a class="contact-line fade-up" data-delay="6" href="tel:+5491124092081">(+54) 9 11 2409-2081</a>
    </div>
    <a id="social-ig" class="fade-up" data-delay="6"
       href="https://www.instagram.com/tomyco_studio/"
       target="_blank" rel="noopener" aria-label="Instagram">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="#EFF4FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="0.8" fill="#EFF4FF" stroke="none"/>
      </svg>
    </a>
  </div>
</div>

<script>
  /* ── REEL ── */
  var REEL_URL = 'https://www.youtube.com/embed/7AukSIl6S1k?autoplay=1&rel=0&modestbranding=1';
  function openReel() {
    document.getElementById('reel-iframe').src = REEL_URL;
    document.getElementById('reel-modal').classList.add('open');
  }
  function closeReel() {
    document.getElementById('reel-modal').classList.remove('open');
    document.getElementById('reel-iframe').src = '';
  }
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeReel(); });
  document.getElementById('reel-modal').addEventListener('click', function(e) {
    if (e.target === this) closeReel();
  });

  /* ── LOGO ANIMATION ── */
  (function() {
    var TOTAL = 52, FPS = 24, frames = [], loaded = 0;

    for (var i = 0; i < TOTAL; i++) {
      var img = new Image();
      img.src = 'Logo/Logo tomyco_' + String(i).padStart(5, '0') + '.png';
      img.onload  = function() { loaded++; if (loaded === TOTAL) startIntro(); };
      img.onerror = function() { loaded++; if (loaded === TOTAL) startIntro(); };
      frames.push(img);
    }

    function startIntro() {
      var screen = document.getElementById('intro-screen');
      var canvas = document.getElementById('intro-logo');
      var ctx    = canvas.getContext('2d');
      var ref    = frames.find(function(f) { return f.naturalWidth > 0; });
      if (!ref) { doFadeOut(screen); return; }

      var ratio  = ref.naturalHeight / ref.naturalWidth;
      canvas.width  = Math.min(280, window.innerWidth * 0.6);
      canvas.height = Math.round(canvas.width * ratio);

      var frame = 0;
      var id = setInterval(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(frames[frame], 0, 0, canvas.width, canvas.height);
        if (frame < TOTAL - 1) { frame++; }
        else { clearInterval(id); setTimeout(function() { doFadeOut(screen); }, 600); }
      }, 1000 / FPS);
    }

    function doFadeOut(screen) {
      screen.classList.add('fade-out');
      setTimeout(function() {
        screen.style.display = 'none';
        revealLanding();
      }, 900);
    }

    function revealLanding() {
      startHeaderLogo();

      /* Staggered entry — 150ms between each element, in data-delay order */
      var STEP = 150;
      var els = Array.from(document.querySelectorAll('.fade-up'));
      els.sort(function(a, b) {
        return parseInt(a.dataset.delay || 0) - parseInt(b.dataset.delay || 0);
      });
      els.forEach(function(el) {
        var delay = parseInt(el.dataset.delay || 0) * STEP;
        setTimeout(function() { el.classList.add('visible'); }, delay);
      });
    }

    function startHeaderLogo() {
      var canvas = document.getElementById('logo-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var ref = frames.find(function(f) { return f.naturalWidth > 0; });
      if (!ref) return;

      var ratio = ref.naturalHeight / ref.naturalWidth;
      var w = canvas.offsetWidth || 140;
      canvas.width  = w;
      canvas.height = Math.round(w * ratio);

      var frame = 0;
      var id = setInterval(function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(frames[frame], 0, 0, canvas.width, canvas.height);
        if (frame < TOTAL - 1) { frame++; }
        else { clearInterval(id); }
      }, 1000 / FPS);
    }
  })();
</script>
</body>
</html>
